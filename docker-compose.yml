services:

  mcp-server:
    build:
      context: .
      dockerfile: dockerfiles/mcp_server.dockerfile
    env_file:
      - .env
    ports:
      - "7000:8000"

  mcp-client:
    build:
      context: .
      dockerfile: dockerfiles/mcp_client.dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mcp-server

  streamlit:
    build:
      context: .
      dockerfile: dockerfiles/streamlit.dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - mcp-client